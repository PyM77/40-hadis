    <script>
      // Принудительный манифест для Android, чтобы 100% появилась иконка
      const manifest = {
        name: "40 Хадисов",
        short_name: "40 Хадисов",

        background_color: "#fdfbf7",

    <!-- Шапка приложения -->
    <header

    >
      <!-- Декоративный паттерн в шапке -->

        class="absolute inset-0 opacity-10 pointer-events-none"
        style="
          background-image: url(&quot;data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='2' cy='2' r='2' fill='%23ffffff'/%3E%3C/svg%3E&quot;);
        "
      ></div>

      <div
        class="max-w-md mx-auto px-4 py-3.5 flex justify-between items-center relative z-10"
      >
        <div class="flex items-center space-x-3">
          <button
            onclick="toggleSidebar()"
            class="p-2 rounded-xl bg-white/10 hover:bg-white/20 transition active:scale-95"
            aria-label="Меню"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h7"
              ></path>
            </svg>
          </button>
          <div>
            <h1 class="text-lg font-bold tracking-wide font-serif">
              Сорок Хадисов
            </h1>
            <p
              class="text-[11px] text-[#c0a16b] font-medium tracking-wider uppercase"
            >
              Имам аль-Аджурри
            </p>
          </div>
        </div>
        <div class="flex items-center space-x-3">
          <span
            class="text-xs bg-black/30 px-3 py-1.5 rounded-full font-bold shadow-inner"

            >1 / 40</span
          >
        </div>
      </div>
    </header>

    <!-- Боковое меню -->
    <div

      class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden transition-opacity opacity-0 pointer-events-none"
    >
      <div
        class="absolute left-0 top-0 bottom-0 w-[85%] max-w-sm bg-[#fdfbf7] shadow-2xl flex flex-col transform -translate-x-full transition-transform duration-300"
        id="sidebar-content"
      >
        <div
          class="p-5 bg-[#064e3b] text-white flex justify-between items-center border-b-4 border-[#c0a16b]"
        >
          <h2 class="font-bold text-lg font-serif">Содержание</h2>
          <button
            onclick="toggleSidebar()"
            class="p-1.5 rounded-xl bg-white/10 hover:bg-white/20 transition"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>

        <div class="p-4 bg-white shadow-sm z-10 relative">
          <div class="relative">
            <svg
              class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"

            </svg>
            <input

              id="search-input"
              oninput="filterHadiths(this.value)"
              placeholder="Поиск по смыслу..."
              class="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#c0a16b] focus:bg-white transition"

          </div>
        </div>

        <div class="flex-1 overflow-y-auto" id="hadiths-list-container">
          <!-- Динамический список -->
        </div>

    </div>

    <!-- Основной контент -->
    <main class="flex-1 overflow-y-auto relative w-full">
      <div
        class="max-w-md mx-auto p-4 min-h-full flex flex-col"
        id="card-container"
      >
        <div
          class="bg-white rounded-[24px] shadow-[0_8px_30px_rgb(0,0,0,0.08)] p-6 flex-1 flex flex-col relative overflow-hidden gold-border"
        >
          <!-- Орнамент в углу -->
          <svg
            class="absolute top-0 right-0 w-32 h-32 text-[#c0a16b] opacity-10 pointer-events-none transform translate-x-8 -translate-y-8"
            viewBox="0 0 100 100"
            fill="currentColor"
          >
            <path d="M50 0L60 40L100 50L60 60L50 100L40 60L0 50L40 40Z" />
          </svg>

          <div class="relative z-10 flex-1 space-y-6">
            <!-- Номер хадиса -->
            <div class="flex items-center justify-between">
              <div
                class="gold-gradient text-white px-5 py-2 rounded-full font-bold text-sm shadow-md flex items-center space-x-2"
              >
                <span>Хадис №</span>
                <span id="hadith-num" class="text-lg">1</span>
              </div>
              <button
                onclick="copyFullHadith()"
                class="p-2 text-slate-400 hover:text-[#c0a16b] bg-slate-50 rounded-full transition"
                title="Скопировать всё"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                  ></path>
                </svg>
              </button>
            </div>

            <!-- Арабский текст -->
            <div class="pt-2">
              <p
                class="arabic-text text-[26px] sm:text-[30px] text-[#064e3b] text-center"
                id="arabic-text"
                dir="rtl"
              ></p>
            </div>

            <!-- Разделитель -->
            <div class="flex justify-center items-center py-2 opacity-30">
              <div class="h-px bg-[#c0a16b] flex-1"></div>
              <svg
                class="w-6 h-6 text-[#c0a16b] mx-4"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M12 2L15 10H23L16 15L19 23L12 18L5 23L8 15L1 10H9L12 2Z"
                />
              </svg>
              <div class="h-px bg-[#c0a16b] flex-1"></div>
            </div>

            <!-- Перевод -->
            <div>
              <h3
                class="text-[10px] font-bold uppercase tracking-widest text-[#c0a16b] mb-3"
              >
                Русский перевод
              </h3>
              <p
                class="text-slate-700 text-[15px] sm:text-[16px] leading-relaxed font-medium"
                id="russian-text"
              ></p>
            </div>

            <!-- Разъяснение (Польза) -->
            <div
              id="explanation-container"
              class="bg-[#fef3c7]/50 border border-[#c0a16b]/30 rounded-2xl p-5 mt-6"
            >
              <h3
                class="text-[10px] font-bold uppercase tracking-widest text-[#92400e] mb-2 flex items-center"
              >
                <svg
                  class="w-4 h-4 mr-1.5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
                Разъяснение и польза
              </h3>
              <p
                class="text-[#78350f] text-[14px] leading-relaxed"

              ></p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Нижняя навигация -->
    <div
      class="bg-white border-t border-slate-200 px-4 py-3 z-20 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]"
    >
      <div class="max-w-md mx-auto flex gap-3">
        <button
          onclick="prevHadith()"
          id="prev-btn"
          class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3.5 px-4 rounded-xl transition text-sm disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center space-x-2"

            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
          <span>Назад</span>
        </button>
        <button
          onclick="nextHadith()"
          id="next-btn"
          class="flex-1 gold-gradient text-white font-semibold py-3.5 px-4 rounded-xl transition shadow-lg shadow-[#c0a16b]/30 text-sm flex items-center justify-center space-x-2"

          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"

    <!-- Уведомления (Toast) -->
    <div
      id="toast"
      class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full text-sm font-medium shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center space-x-2"
    >
      <svg
        class="w-5 h-5 text-green-400"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M5 13l4 4L19 7"
        ></path>
      </svg>
      <span id="toast-msg">Скопировано</span>

    <script>
      // ПОЛНАЯ БАЗА 40 ХАДИСОВ С ТОЧНЫМИ ТЕКСТАМИ
      const hadiths = [
        {
          id: 1,
          title: "Понимание в религии",
          arabic:
            "عَنْ أَبِي هُرَيْرَةَ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: مَنْ يُرِدِ اللَّهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ",
          russian:
            "От Абу Хурайры, который сказал: Сказал Посланник Аллаха ﷺ: «Кому Аллах желает блага, даёт понимание в Веровании».",
          explanation:
            "Этот хадис указывает на то, что в том, кто не обрёл правильное понимание в своём веровании, нет никакого блага. И если ты скажешь: «Какие признаки должны быть у того, кому Аллах дал понимание?», то это мусульманин, который узнал, что покорность Аллаху выражается путём совершения обязательств так, как Аллах велел, и он получает знания, чтобы правильно поклоняться.",
        },
        {
          id: 2,
          title: "Достоинство знаний",
          arabic:
            "عَنْ أَبِي أُمَامَةَ الْبَاهِلِي: رَضِيَ اللَّهُ عَنْهُ أَنَّ رَسُولَ اللَّهِ صَلَّى اللهُ عَلَيْهِ وَسَلَّمَ قَالَ: عَلَيْكُمْ بِالْعِلْمِ قَبْلَ أَنْ يُقْبَضَ: وَقَبْلَ أَنْ يُرْفَعَ ثُمَّ جَمَعَ بَيْنَ أُصْبُعَيْهِ الْوُسْطَى وَالَّتِي تَلِي الإِبْهَامَ: ثُمَّ قَالَ: الْعَالِمُ وَالْمُتَعَلِّمُ شَرِيكَانِ فِي الْأَجْرِ: وَلَا خَيْرَ فِي النَّاسِ بَعْدُ",
          russian:
            "От Абу Умамы аль-Бахили, что Посланник Аллаха ﷺ сказал: «Вам следует получать знания, пока оно не будет забрано, или оно не будет поднято». Затем он сложил свои два пальца, средний и указательный, и сказал: «Знающий и получающий знания являются соучастниками в награде, и нет блага в людях после этого».",
          explanation:
            "Осмысли – да помилует Аллах нас и тебя – с чем обратился к тебе Пророк. Он побуждает тебя получать знания до того, как исчезнут обладатели знаний. Благо есть только среди тех, которые получают знания, и тех, которые обучают.",
        },
        {
          id: 3,
          title: "Дела по намерениям",
          arabic:
            "عُمَرَ بْنَ الْخَطَابِ رَضِيَ اللَّهُ عَنْهُ يَقُولُ: إِنَّمَا الْأَعْمَالُ بالنِّيَّةِ: وَإِنَّمَا لِامْرِئٍ مَا نَوَى: فَمَنْ كَانَتْ هِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ فَهِجْرَتُهُ إِلَى اللَّهِ وَرَسُولِهِ: وَمَنْ كَانَتْ هِجْرَتُهُ إِلَى دُنْيَا يُصِيبُهَا أَوِ امْرَأَةٍ يَتَزَوَّجُهَا فَهِجْرَتُهُ إِلَى مَا هَاجَرَ إِلَيْهِ",
          russian:
            "Поистине, дела (оцениваются) только по намерению и, поистине, каждому человеку (достанется) лишь то, что он намеревался (обрести). И (поэтому) переселявшийся к Аллаху и Его посланнику (будет считаться) переселившимся к Аллаху и Его посланнику, а переселявшийся ради чего-нибудь мирского, обретёт его, или ради женщины, то женится на ней, и переселится он (лишь) к тому, к чему переселялся ",
          explanation:
            "Этот хадис является основой Ислама, и никому из мусульман не разрешается совершать то, что Аллах возложил на него обязанностью, кроме как только имея чистое и правдивое намерение ради Аллаха, а не с целью, чтобы это увидели люди.",
        },
        {
          id: 4,
          title: "Столпы Ислама",
          arabic:
            "عَنِ ابْنِ عُمَرَ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: بُنِيَ الإِسْلَامُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللَّهُ: وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ: وَإِقَامِ الصَّلَاةِ: وَإِيتَاءِ الزَّكَاةِ: وَصَوْمِ شَهْرٍ رَمَضَانَ : وَحَجَّ الْبَيْتِ",
          russian:
            "От Ибн Умара, что он сказал: Посланник Аллаха ﷺ сказал: «Ислам основывается на пяти (столпах): свидетельстве о том, что нет бога, кроме Аллаха, и что Мухаммад – посланник Аллаха, совершении молитвы, выплате закята, совершении хаджжа и соблюдении поста в рамадане».",
          explanation:
            "Познай смысл этого хадиса. Кто оставит одно из этих пяти обязательных деяний, и проявит в него неверие и будет отрицать его, тому не поможет Единобожие, и он не будет мусульманином.",
        },
        {
          id: 5,
          title: "Ислам, Иман, Ихсан",
          arabic:
            "قَالَ: حَدَّثَنَا الْآجُرِّيُّ، قَالَ: أَخْبَرَنَا الْفِرْيَابِيُّ، قَالَ: أَخْبَرَنَا إِسْحَاقُ بْنُ رَاهَوَيْهِ، قَالَ: أَخْبَرَنَا النَّضْرُ بْنُ شُمَيْلٍ، قَالَ: حَدَّثَنَا كَهْمَسُ بْنُ الْحَسَنِ، قَالَ: حَدَّثَنَا عَبْدُ اللَّهِ بْنُ بُرَيْدَةَ، عَنْ يَحْيَى بْنِ يَعْمُرَ، قَالَ: كَانَ أَوَّلَ مَنْ قَالَ فِي هَذَا الْقَدَرِ بِالْبَصْرَةِ مَعْبَدٌ الْجُهَنِيُّ، فَانْطَلَقْتُ أَنَا وَحُمَيْدُ بْنُ عَبْدِ الرَّحْمَنِ حَاجَّيْنِ أَوْ مُعْتَمِرَيْنِ، قَالَ: فَقُلْنَا: لَوْ لَقِينَا أَحَدًا مِنْ أَصْحَابِ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، فَسَأَلْنَاهُ عَمَّا يَقُولُ هَؤُلَاءِ فِي الْقَدَرِ. فَوَافَقْنَا عَبْدَ اللَّهِ بْنَ عُمَرَ دَاخِلَ الْمَسْجِدِ، فَاكْتَنَفْتُهُ أَنَا وَصَاحِبِي، أَحَدُنَا عَنْ يَمِينِهِ وَالْآخَرُ عَنْ يَسَارِهِ، فَظَنَنْتُ أَنَّ صَاحِبِي سَيَكِلُ الْكَلَامَ إِلَيَّ، فَقُلْتُ لَهُ: يَا أَبَا عَبْدِ الرَّحْمَنِ، إِنَّهُ قَدْ ظَهَرَ قِبَلَنَا أُنَاسٌ يَقْرَؤُونَ الْقُرْآنَ، وَيَتَقَفَّرُونَ الْعِلْمَ، وَيَزْعُمُونَ أَنْ لَا قَدَرَ، وَأَنَّ الْأَمْرَ أُنُفٌ. قَالَ: فَإِذَا لَقِيتُمُوهُمْ فَأَخْبِرُوهُمْ أَنِّي مِنْهُمْ بَرِيءٌ، وَأَنَّهُمْ مِنِّي بُرَآءُ، وَالَّذِي يَحْلِفُ بِهِ عَبْدُ اللَّهِ بْنُ عُمَرَ: لَوْ كَانَ لِأَحَدِهِمْ مِلْءُ الْأَرْضِ ذَهَبًا، فَأَنْفَقَهُ فِي سَبِيلِ اللَّهِ، مَا قَبِلَ اللَّهُ عَزَّ وَجَلَّ مِنْهُ ذَلِكَ حَتَّى يُؤْمِنَ بِالْقَدَرِ.ثُمَّ قَالَ: حَدَّثَنِي عُمَرُ بْنُ الْخَطَّابِ رَضِيَ اللَّهُ عَنْهُ، قَالَ: بَيْنَمَا نَحْنُ عِنْدَ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، إِذْ طَلَعَ عَلَيْنَا رَجُلٌ شَدِيدُ بَيَاضِ الثِّيَابِ، شَدِيدُ سَوَادِ الشَّعْرِ، لَا يُرَى عَلَيْهِ أَثَرُ السَّفَرِ، وَلَا يَعْرِفُهُ أَحَدٌ مِنَّا، حَتَّى جَلَسَ إِلَى نَبِيِّ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، فَأَسْنَدَ رُكْبَتَيْهِ إِلَى رُكْبَتَيْهِ، وَوَضَعَ كَفَّيْهِ عَلَى فَخِذَيْهِ، ثُمَّ قَالَ:يَا مُحَمَّدُ، أَخْبِرْنِي عَنِ الْإِسْلَامِ، وَمَا الْإِسْلَامُ؟ قَالَ: أَنْ تَشْهَدَ أَنْ لَا إِلَهَ إِلَّا اللَّهُ، وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَتُقِيمَ الصَّلَاةَ، وَتُؤْتِيَ الزَّكَاةَ، وَتَصُومَ شَهْرَ رَمَضَانَ، وَتَحُجَّ الْبَيْتَ إِنِ اسْتَطَعْتَ إِلَيْهِ سَبِيلًا. قَالَ: صَدَقْتَ. قَالَ: فَعَجِبْنَا لَهُ، يَسْأَلُهُ وَيُصَدِّقُهُ.قَالَ: فَأَخْبِرْنِي عَنِ الْإِيمَانِ. قَالَ: أَنْ تُؤْمِنَ بِاللَّهِ، وَمَلَائِكَتِهِ، وَكُتُبِهِ، وَرُسُلِهِ، وَالْيَوْمِ الْآخِرِ، وَالْقَدَرِ خَيْرِهِ وَشَرِّهِ. قَالَ: صَدَقْتَ. قَالَ: فَعَجِبْنَا لَهُ، يَسْأَلُهُ وَيُصَدِّقُهُ.قَالَ: فَأَخْبِرْنِي عَنِ الْإِحْسَانِ. قَالَ: أَنْ تَعْبُدَ اللَّهَ كَأَنَّكَ تَرَاهُ، فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ. قَالَ: صَدَقْتَ. قَالَ: فَأَخْبِرْنِي عَنِ السَّاعَةِ. قَالَ: مَا الْمَسْئُولُ عَنْهَا بِأَعْلَمَ مِنَ السَّائِلِ.قَالَ عُمَرُ رَضِيَ اللَّهُ عَنْهُ: فَلَبِثْتُ ثَلَاثًا، ثُمَّ قَالَ لِي رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: يَا عُمَرُ، هَلْ تَدْرِي مَنِ السَّائِلُ؟ فَقُلْتُ: اللَّهُ وَرَسُولُهُ أَعْلَمُ. قَالَ: فَإِنَّهُ جِبْرِيلُ عَلَيْهِ السَّلَامُ، أَتَاكُمْ يُعَلِّمُكُمْ أَمْرَ دِينِكُمْ.",
          russian:
            "Нам сообщил аль-Аджурри, который сказал: нам рассказал аль-Фарьяби, который сказал: нам рассказал Исхак бин Рахавайх, который сказал: нам рассказал ан-Надр бин Шумейль, который сказал: нам рассказал Кахмас бин аль-Хасан, который сказал: нам рассказал ‘Абдуллах бин Бурайда от Йахьи бин Йа‘мара, который сказал: первым, кто начал отрицать предопределение в Басре, был Ма‘бад аль-Джухани. Мы с Хумайдом бин ‘Абдуррахманом аль-Химьяри отправились совершать хадж или ‘умру. При этом мы подумали, что было бы хорошо встретить кого-нибудь из сподвижников Посланника Аллаха ﷺ и спросить его о том, что говорят эти люди о предопределении. И мы встретили ‘Абдуллаха ибн ‘Умара, который как раз входил в мечеть. Мы подошли к нему и оказались с двух сторон от него: один из нас оказался справа, а другой слева. Я подумал, что мой товарищ предоставит говорить мне, и сказал ему: \"О Абу ‘Абдуррахман, там, где мы живём, появились люди, которые читают Коран и приобретают знание, но при этом отрицают предопределение и считают, что дела свершаются (без предопределения)!\" Он сказал в ответ: \"Когда встретите их, передайте им, что я отрекаюсь от них и они не имеют ко мне отношения. Клянусь Тем, Кем клянётся ‘Абдуллах ибн ‘Умар, даже если у одного из них будет целая гора золота и он потратит её на благие дела, Аллах не примет это от него до тех пор, пока он не уверует в предопределение!\" Затем (‘Абдуллах ибн ‘Умар) сказал: «‘Умар ибн аль-Хаттаб рассказывал мне: “Однажды, когда мы сидели с Посланником Аллаха ﷺ, перед нами появился человек в белоснежной одежде с очень чёрными волосами. На нём не было следов пребывания в пути, и никто из нас не знал его. Он сел перед Пророком Аллаха ﷺ, почти прислонился своими коленями к его коленям, положил руки себе на бёдра и сказал: “О Мухаммад, расскажи мне об Исламе. Что такое Ислам?” Посланник Аллаха ﷺ сказал: “Это когда ты свидетельствуешь, что нет бога, кроме Аллаха, и что Мухаммад — посланник Аллаха, совершаешь молитву, выплачиваешь закят, соблюдаешь пост в месяце Рамадан и совершаешь хадж к Дому, если имеешь такую возможность”. Тот человек сказал: “Ты сказал правду”. Мы удивились: ведь он и спрашивает Посланника Аллаха, и подтверждает его правоту. Он сказал: “Расскажи мне о вере”. Посланник Аллаха ﷺ сказал: “Это когда ты веруешь в Аллаха, в Его ангелов, в Его писания, в Его посланников, в Последний день и веруешь в предопределённость добра и зла”. Он сказал: “Ты сказал правду”. Мы удивились: ведь он и спрашивает Посланника Аллаха, и подтверждает его правоту. И затем он попросил: “Расскажи мне о совершенстве в поклонении Аллаху (ихсан)”. Посланник Аллаха ﷺ сказал: “Это когда ты поклоняешься Аллаху так, как будто ты Его видишь. Ведь если ты и не видишь Его, то, поистине, Он видит тебя”. Тот человек сказал: “Расскажи мне о Часе”. Посланник Аллаха ﷺ сказал: “Тот, у кого спрашивают об этом, знает об этом не больше спрашивающего”. ‘Умар сказал: “Прошло три дня, и потом Посланник Аллаха ﷺ сказал: “О ‘Умар, знаешь ли, кто этот задававший вопросы?” Я сказал: “Аллах и Его посланник знают об этом лучше”. Тогда он сказал: “Поистине, это Джибриль приходил к вам, дабы научить вас вашей религии!”»",
          explanation:
            "Пророк ﷺ научил тебя посредством этого хадиса сути верования. Совершенство (Ихсан) — это когда ты поклоняешься Аллаху так, как будто ты Его видишь. Кто заботится об этом, тот боится и страшится Аллаха.",
        },
        {
          id: 6,
          title: "Сотворение и предопределение",
          arabic:
            "عَنْ عَبْدِ اللَّهِ بْنِ مَسْعُودٍ قَالَ: حَدَّثَنَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، وَهُوَ الصَّادِقُ الْمَصْدُوقُ: إِنَّ خَلْقَ أَحَدِكُمْ يُجْمَعُ فِي بَطْنِ أُمِّهِ أَرْبَعِينَ لَيْلَةً، ثُمَّ يَكُونُ عَلَقَةً مِثْلَ ذَلِكَ، ثُمَّ يَكُونُ مُضْغَةً مِثْلَ ذَلِكَ، ثُمَّ يَبْعَثُ اللَّهُ عَزَّ وَجَلَّ إِلَيْهِ مَلَكًا، فَيُؤْمَرُ بِأَرْبَعِ كَلِمَاتٍ، فَيَكْتُبُ عَمَلَهُ، وَأَجَلَهُ، وَرِزْقَهُ، وَشَقِيٌّ أَمْ سَعِيدٌ، ثُمَّ يَنْفُخُ فِيهِ الرُّوحَ، فَإِنَّ أَحَدَكُمْ لَيَعْمَلُ بِعَمَلِ أَهْلِ الْجَنَّةِ حَتَّى مَا يَكُونُ بَيْنَهُ وَبَيْنَهَا إِلَّا ذِرَاعٌ، فَيَسْبِقُ عَلَيْهِ الْكِتَابُ، فَيَعْمَلُ بِعَمَلِ أَهْلِ النَّارِ، فَيَدْخُلُ النَّارَ، وَإِنَّ أَحَدَكُمْ لَيَعْمَلُ بِعَمَلِ أَهْلِ النَّارِ حَتَّى مَا يَكُونُ بَيْنَهُ وَبَيْنَهَا إِلَّا ذِرَاعٌ، فَيَسْبِقُ عَلَيْهِ الْكِتَابُ، فَيَعْمَلُ بِعَمَلِ أَهْلِ الْجَنَّةِ، فَيَدْخُلُهَا.",
          russian:
            "От 'Абдуллаха бин Мас'уда: Правдивый и достойный доверия Посланник Аллаха ﷺ сказал нам: «Поистине, каждый из вас (сначала) формируется во чреве своей матери в течение сорока ночей, затем он столько же пребывает (там) в виде сгустка крови и ещё столько же — в виде кусочка плоти, а затем Аллах направляет ангела, который получает веление записать четыре вещи, и он записывает его дела, его срок, его удел, а также то, несчастным он будет или счастливым», после чего в него вдувается дух. И, поистине, любой из вас может совершать (благие) дела до тех пор, пока не окажется от Рая на расстоянии (всего лишь одного) локтя, и тогда сбудется записанное ему (на роду), и станет он совершать дела обитателей Огня, и войдёт в Огонь. И (точно так же) любой из вас может совершать дела обитателей Огня, пока не окажется от Огня на расстоянии (всего лишь одного) локтя, и тогда сбудется записанное ему (на роду), и станет он совершать дела обитателей Рая, и войдёт в него»",
          explanation:
            "Тебе следует знать, что Аллах уже определил удел рабов, сроки жизни, и дела. И верить в предопределение обязательно, и кто в это не верит, тот является неверующим.",

        {
          id: 7,
          title: "Вера в предопределение",
          arabic:
            "عَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: كُنَّا فِي جَنَازَةٍ فِي بَقِيعِ الْغَرْقَدِ، قَالَ: فَأَتَانَا رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ، فَقَعَدَ وَقَعَدْنَا حَوْلَهُ، وَمَعَهُ مِخْصَرَةٌ، فَنَكَسَ رَأْسَهُ فَجَعَلَ يَنْكُتُ بِمِخْصَرَتِهِ، ثُمَّ قَالَ: مَا مِنْكُمْ مِنْ نَفْسٍ مَنْفُوسَةٍ إِلَّا وَقَدْ كُتِبَ مَكَانُهَا مِنَ الْجَنَّةِ وَالنَّارِ، وَإِلَّا وَقَدْ كُتِبَتْ شَقِيَّةً أَوْ سَعِيدَةً. فَقَالَ رَجُلٌ: يَا رَسُولَ اللَّهِ، أَفَلَا نَتَّكِلُ عَلَى كِتَابِنَا وَنَدَعُ الْعَمَلَ، فَمَنْ كَانَ مِنَّا مِنْ أَهْلِ السَّعَادَةِ فَسَيَصِيرُ إِلَى عَمَلِ أَهْلِ السَّعَادَةِ، وَمَنْ كَانَ مِنَّا مِنْ أَهْلِ الشَّقَاءِ فَسَيَصِيرُ إِلَى عَمَلِ أَهْلِ الشَّقَاوَةِ؟ فَقَالَ: اعْمَلُوا، فَكُلٌّ مُيَسَّرٌ لِعَمَلِهِ، أَمَّا أَهْلُ السَّعَادَةِ فَيُيَسَّرُونَ لِعَمَلِ أَهْلِ السَّعَادَةِ، وَأَمَّا أَهْلُ الشَّقَاوَةِ فَيُيَسَّرُونَ لِعَمَلِ أَهْلِ الشَّقَاوَةِ، ثُمَّ قَرَأَ: فَأَمَّا مَنْ أَعْطَى وَاتَّقَى، وَصَدَّقَ بِالْحُسْنَى، فَسَنُيَسِّرُهُ لِلْيُسْرَى، وَأَمَّا مَنْ بَخِلَ وَاسْتَغْنَى، وَكَذَّبَ بِالْحُسْنَى، فَسَنُيَسِّرُهُ لِلْعُسْرَى.",          
          russian:
                "От Али бин Абу Талиба رضي الله عنه передается, что он сказал: «(Однажды) когда мы присутствовали на похоронах в Баки‘ аль-Гаркад, к нам подошёл Пророк ﷺ. Он сел, и мы сели вокруг него. У него была небольшая палка, и он опустил голову и стал разбрасывать этой палкой землю, а (через некоторое время) он сказал: “Нет никого среди вас, как нет и вообще ни одной живой души, место которой в Раю или в Аду уже не было бы определено, и определено также, несчастной она является или счастливой”. Один человек сказал: “О Посланник Аллаха, так не положиться ли нам на то, что уже предопределено нам, и не отказаться ли от дел, ведь тот из нас, кто относится к числу счастливых, (всё равно) придёт к делам счастливых, а относящийся к числу несчастных (всё равно) придёт к делам несчастных?” (В ответ на это Пророк ﷺ) сказал: “Вы совершайте деяния, и каждому будет облегчено к его деянию. Что касается счастливых, то для них будет облегчено совершение дел счастливых, что же касается несчастных, то для них будет облегчено совершение дел несчастных”, после чего прочитал следующие аяты: فَأَمَّا مَنْ أَعْطَىٰ وَاتَّقَىٰ ۝٥ وَصَدَّقَ بِالْحُسْنَىٰ ۝٦ فَسَنُيَسِّرُهُ لِلْيُسْرَىٰ ۝٧ وَأَمَّا مَنْ بَخِلَ وَاسْتَغْنَىٰ ۝٨ وَكَذَّبَ بِالْحُسْنَىٰ ۝٩ فَسَنُيَسِّرُهُ لِلْعُسْرَىٰ ۝١٠. «Что касается того, кто отдавал и остерегался (наказания Аллаха), и признавал наилучшее, то Мы облегчим ему (путь) к легчайшему. А что касается того, кто скупился и обогащался, и не поверил в истинность прекраснейшего, — тому Мы облегчим к трудности» (сура «аль-Ляйль», аяты 5–10).",
          explanation:
            "Вера в это является обязательной. Рабам Аллаха велено совершать деяния в повиновении Ему. И Аллах будет оказывать содействие тем, кого Он любит, в делах повиновения Себе.",
        },
        {
          id: 8,
          title: "Следование Сунне",
          arabic:
            "عَنْ عَبْدِ الرَّحْمَنِ بْنِ عَمْرٍو السُّلَمِيِّ وَحُجْرِ بْنِ الْكَعْبِ، قَالَا: دَخَلْنَا عَلَى الْعِرْبَاضِ بْنِ سَارِيَةَ، وَهُوَ مِنَ الَّذِينَ نَزَلَ فِيهِمْ: وَلَا عَلَى الَّذِينَ إِذَا مَا أَتَوْكَ لِتَحْمِلَهُمْ قُلْتَ لَا أَجِدُ مَا أَحْمِلُكُمْ عَلَيْهِ [التوبة] الْآيَةُ، دَخَلُوا عَلَيْهِ وَهُوَ مَرِيضٌ، قَالَ: فَقُلْنَا لَهُ: إِنَّا جِئْنَاكَ زَائِرِينَ وَعَائِدِينَ وَمُقْتَبِسِينَ، فَقَالَ الْعِرْبَاضُ: إِنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ صَلَّى بِنَا صَلَاةَ الْغَدَاةِ، ثُمَّ أَقْبَلَ عَلَيْنَا فَوَعَظَنَا بِمَوْعِظَةٍ بَلِيغَةٍ، ذَرَفَتْ مِنْهَا الْعُيُونُ، وَوَجِلَتْ مِنْهَا الْقُلُوبُ، فَقَالَ قَائِلٌ: يَا رَسُولَ اللَّهِ، إِنَّ هَذِهِ لَمَوْعِظَةُ مُوَدِّعٍ، فَمَاذَا تَعْهَدُ إِلَيْنَا؟ قَالَ: أُوصِيكُمْ بِتَقْوَى اللَّهِ، وَالسَّمْعِ وَالطَّاعَةِ، وَإِنْ كَانَ عَبْدًا حَبَشِيًّا، فَإِنَّهُ مَنْ يَعِشْ مِنْكُمْ بَعْدِي سَيَرَى اخْتِلَافًا كَثِيرًا، فَعَلَيْكُمْ بِسُنَّتِي وَسُنَّةِ الْخُلَفَاءِ الرَّاشِدِينَ الْمَهْدِيِّينَ، عَضُّوا عَلَيْهَا بِالنَّوَاجِذِ، وَإِيَّاكُمْ وَمُحْدَثَاتِ الْأُمُورِ، فَإِنَّ كُلَّ مُحْدَثَةٍ بِدْعَةٌ، وَكُلَّ بِدْعَةٍ ضَلَالَةٌ.",
          russian:
            "От Абдуррахмана бин Амра ас-Сулями и Худжра аль-Каля‘и передаётся, что они сказали: (однажды) мы зашли к аль-‘Ирбаду бин Сарийя, который был одним из тех, о которых был ниспослан аят: وَلَا عَلَى الَّذِينَ إِذَا مَا أَتَوْكَ لِتَحْمِلَهُمْ قُلْتَ لَا أَجِدُ مَا أَحْمِلُكُمْ عَلَيْهِ تَوَلَّوْا وَأَعْيُنُهُمْ تَفِيضُ مِنَ الدَّمْعِ ۝٩٢ «И (также нет греха) ни на тех, которые, когда они пришли к тебе (о Посланник), чтобы ты их отправил (в поход), ты сказал: “Не нахожу я (верхового животного), на чём вас отправить”. Они отвернулись, и глаза их были полны слёз…» (сура «ат-Тауба», аят 92), и который был болен. Мы сказали ему: «Мы пришли навестить тебя, узнать о твоём здоровье и получить от тебя пользу». И сказал ‘Ирбад: «Однажды Посланник Аллаха ﷺ совершил с нами утреннюю молитву, а затем обратился к нам с сильным увещанием, от которого глаза наполнились слезами, а сердца охватил страх. Один человек сказал: “О Посланник Аллаха, поистине, это — увещание прощающегося, так что же ты поручишь нам?” Он сказал: “Я завещаю вам остерегаться наказания Аллаха, слушаться и повиноваться (исламскому правителю), даже если это будет эфиопский раб. Тот из вас, кто проживёт (достаточно долго) после меня, станет свидетелем многих раздоров, вам же следует придерживаться моей сунны и сунны праведных халифов, которые благоразумны и следуют истинным путём. Держитесь за неё своими коренными зубами. И вам следует отстраняться от новшеств в Исламе, ибо каждое новшество является нововведением, и каждое нововведение является заблуждением”.»",
          explanation:
            "Этот хадис содержит в себе много знаний: приказ остерегаться наказания Аллаха, слушаться правителей в одобряемом, придерживаться Сунны и предостережение от нововведений (бид'а).",
        },
        {
          id: 9,
          title: "Ниспослание Корана",
          arabic:
            "عَنِ ابْنِ مَسْعُودٍ، عَنْ رَسُولِ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: كَانَ الْكِتَابُ الْأَوَّلُ نَزَلَ مِنْ بَابٍ وَاحِدٍ وَعَلَى وَجْهٍ وَاحِدٍ، وَنَزَلَ الْقُرْآنُ مِنْ سَبْعَةِ أَبْوَابٍ عَلَى سَبْعَةِ أَحْرُفٍ: زَاجِرٍ وَآمِرٍ، وَحَلَالٍ وَحَرَامٍ، وَمُحْكَمٍ وَمُتَشَابِهٍ، وَأَمْثَالٍ. فَأَحِلُّوا حَلَالَهُ، وَحَرِّمُوا حَرَامَهُ، وَافْعَلُوا مَا أُمِرْتُمْ، وَانْتَهُوا عَمَّا نُهِيتُمْ، وَاعْتَبِرُوا بِأَمْثَالِهِ، وَاعْمَلُوا بِمُحْكَمِهِ، وَآمِنُوا بِمُتَشَابِهِهِ، وَقُولُوا: آمَنَّا بِهِ، كُلٌّ مِنْ عِنْدِ رَبِّنَا.",
          russian:
            "Передаётся от Ибн Мас‘уда رضي الله عنه, от Посланника Аллаха ﷺ, который сказал: «Первая книга была ниспослана в одной полной главе и в одной форме, а Коран был ниспослан через семь дверей, которые соответствуют семи харфам: предостерегающим, велящим, с разъяснениями, что дозволено и что запретно, с аятами с однозначным смыслом и с аятами с многозначным смыслом и с примерами. Поэтому считайте дозволенным то, что названо в нём дозволенным, и считайте запретным то, что названо в нём запретным, и совершайте то, что вам велено, и удержитесь от того, что вам запрещено, берите назидание из его примеров, и действуйте по аятам с однозначным смыслом и веруйте в аяты с многозначным смыслом, и говорите: «Уверовали мы в него; всё (в нём) — от нашего Господа»»",
          explanation:
            "Коран ниспослан на семи диалектах. Мусульманин обязан следовать предписаниям Корана, действуя по ясным аятам и веруя в аяты с многозначным смыслом, не вступая в споры.",
        },
        {
          id: 10,
          title: "Обрадованные Раем",
          arabic:
            "عَنْ عَبْدِ الرَّحْمَنِ بْنِ عَوْفٍ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: أَبُو بَكْرٍ فِي الْجَنَّةِ، وَعُمَرُ فِي الْجَنَّةِ، وَعُثْمَانُ فِي الْجَنَّةِ، وَعَلِيٌّ فِي الْجَنَّةِ، وَطَلْحَةُ فِي الْجَنَّةِ، وَالزُّبَيْرُ فِي الْجَنَّةِ، وَعَبْدُ الرَّحْمَنِ فِي الْجَنَّةِ، وَسَعْدٌ فِي الْجَنَّةِ، وَسَعِيدٌ فِي الْجَنَّةِ، وَأَبُو عُبَيْدَةَ بْنُ الْجَرَّاحِ فِي الْجَنَّةِ.",
          russian:
            "От Абдуррахмана бин Ауфа رضي الله عنه передаётся, что он сказал: Посланник Аллаха ﷺ сказал: «Абу Бакр в Раю, ‘Умар в Раю, ‘Усман в Раю, ‘Али в Раю, Тальха в Раю, аз-Зубайр в Раю, ‘Абдуррахман в Раю, Са‘д в Раю, Са‘ид бин Зайд в Раю, Абу ‘Убайда бин аль-Джаррах в Раю [да будет Аллах доволен ими всеми]».",

        },
        {
          id: 11,
          title: "Достоинство сподвижников",
          arabic:
            "عَنْ عَبْدِ الرَّحْمَنِ بْنِ سَالِمِ بْنِ عَبْدِ الرَّحْمَنِ بْنِ عُوَيْمِ بْنِ سَاعِدَةَ، عَنْ أَبِيهِ، عَنْ جَدِّهِ، أَنَّ رَسُولَ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ قَالَ: إِنَّ اللَّهَ عَزَّ وَجَلَّ اخْتَارَنِي وَاخْتَارَ لِي أَصْحَابًا، فَجَعَلَ لِي مِنْهُمْ وُزَرَاءَ وَأَنْصَارًا وَأَصْهَارًا، فَمَنْ سَبَّهُمْ فَعَلَيْهِ لَعْنَةُ اللَّهِ وَالْمَلَائِكَةِ وَالنَّاسِ أَجْمَعِينَ، لَا يَقْبَلُ اللَّهُ مِنْهُ يَوْمَ الْقِيَامَةِ صَرْفًا وَلَا عَدْلًا.",
          russian:
            "Рассказал Абдуррахман бин Салим бин Абдуррахман бин ‘Уваййим бин Са‘ида от своего отца, который рассказал от своего отца, что Посланник Аллаха ﷺ сказал: «Поистине, Аллах Всевышний выбрал меня и выбрал для меня сподвижников, и сделал для меня из них советников, помощников и родственников через брак. Кто же будет ругать их, того проклянут Аллах, ангелы и все люди, и Аллах не примет от него в День Воскрешения ни покаяния, ни искупления».",
          explanation:

        },
        {
          id: 12,
          title: "Суть Имана",
          arabic:
            "عَنْ عَلِيِّ بْنِ أَبِي طَالِبٍ رَضِيَ اللَّهُ عَنْهُ قَالَ: قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ: الْإِيمَانُ قَوْلٌ بِاللِّسَانِ، وَعَمَلٌ بِالْأَرْكَانِ، وَيَقِينٌ بِالْقَلْبِ.",
          russian:
            "От Али бин Абу Талиба رضي الله عنه передаётся, что он сказал: Посланник Аллаха ﷺ сказал: «Вера — это слова, произносимые языком, действия, совершаемые частями тела, и убеждённость в сердце».",

        },
        {
          id: 13,

          explanation:

            "عَنْ أَبِي هُرَيْرَةَ... قَالَ: سَبْعَةٌ يُظِلُّهُمُ اللَّهُ فِي ظِلِّهِ يَوْمَ لَا ظِلَّ إِلَّا ظِلُّهُ: إِمَامٌ عَادِلٌ وَشَابٌّ نَشَأَ فِي عِبَادَةِ اللَّهِ... وَرَجُلٌ ذَكَرَ اللَّهَ خَالِيًا فَفَاضَتْ عَيْنَاهُ وَرَجُلَانِ تَحَابَّا فِي اللَّهِ... وَرَجُلٌ قَلْبُهُ مُعَلَّقٌ بِالْمَسَاجِدِ... وَرَجُلٌ تَصَدَّقَ بِصَدَقَةٍ فَأَخْفَاهَا... وَرَجُلٌ دَعَتْهُ امْرَأَةٌ ذَاتُ مَنْصِبٍ وَجَمَالٍ فَقَالَ إِنِّي أَخَافُ اللَّهَ",
          russian:
            "От Абу Хурайры: Посланник Аллаха ﷺ сказал: «Семеро (будут) в тени Аллаха в День, когда не будет иной тени: справедливый правитель; юноша, росший в поклонении; плачущий от страха пред Аллахом в одиночестве; двое любящих друг друга ради Аллаха; человек, чье сердце привязано к мечетям; дающий милостыню втайне; и мужчина, отказавший знатной красивой женщине со словами: 'Я боюсь Аллаха'».",
          explanation:
            "Это благородный хадис, из которого берут пример все, кто искренне поклоняется Аллаху Всевышнему.",
        },
        {
          id: 40,
          title: "Завещание Абу Зарру",
          arabic:
            "عَنْ أَبِي ذَرٍّ رَضِيَ اللَّهُ عَنْهُ... فِي حَدِيثٍ طَوِيلٍ... قُلْتُ: يَا رَسُولَ اللَّهِ أَيُّ الْأَعْمَالِ أَفْضَلُ؟ قَالَ: إِيمَانٌ بِاللَّهِ وَجِهَادٌ فِي سَبِيلِهِ... ثُمَّ ضَرَبَ بِيَدِهِ عَلَى صَدْرِي وَقَالَ: يَا أَبَا ذَرٍّ لَا عَقْلَ كَالتَّدْبِيرِ وَلَا وَرَعَ كَالْكَفِّ وَلَا حَسَبَ كَحُسْنِ الْخُلُقِ",
          russian:
            "Из очень длинного хадиса от Абу Зарра, в котором Пророк ﷺ ответил на множество вопросов: лучшим делом назвал Веру и усердие, лучшим верующим — обладателя лучшего нрава. Он рассказал, что пророков было 124 000, а посланников 313. В конце он ударил рукой по груди Абу Зарра и сказал: «О Абу Зарр, нет разума, подобного (разуму, который) размышляет, и нет воздержания, подобного воздержанию от запретного, и нет чести и достоинства, подобного благому нраву».",
          explanation:
            "Этот великий хадис, завершающий сборник, содержит основы веры, истории пророков и мудрые наставления. Просим Аллаха даровать нам полезные знания и праведный нрав!",
        },
      ];

      let currentIndex = 0;

      function updateView() {
        const current = hadiths[currentIndex];

        // Анимация плавного появления
        const card = document.getElementById("card-container");
        card.classList.remove("fade-in");
        void card.offsetWidth; // Триггер рефлоу
        card.classList.add("fade-in");

        document.getElementById("hadith-num").innerText = current.id;
        document.getElementById("counter").innerText =
          `${currentIndex + 1} / 40`;
        document.getElementById("arabic-text").innerText = current.arabic;
        document.getElementById("russian-text").innerText = current.russian;

        const expContainer = document.getElementById("explanation-container");
        if (current.explanation) {
          document.getElementById("explanation-text").innerText =
            current.explanation;
          expContainer.style.display = "block";
        } else {
          expContainer.style.display = "none";
        }

        // Навигация
        document.getElementById("prev-btn").disabled = currentIndex === 0;
        const nextBtn = document.getElementById("next-btn");

        if (currentIndex === hadiths.length - 1) {
          nextBtn.innerHTML = `<span>Завершить</span><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
        } else {
          nextBtn.innerHTML = `<span>Вперед</span><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>`;
        }

        // Скролл вверх при перелистывании
        document.querySelector("main").scrollTop = 0;
      }

      function nextHadith() {
        if (currentIndex < hadiths.length - 1) {
          currentIndex++;
          updateView();
        }
      }

      function prevHadith() {
        if (currentIndex > 0) {
          currentIndex--;
          updateView();
        }
      }

      function goToHadith(index) {
        currentIndex = index;
        updateView();
        toggleSidebar(); // Закрываем меню после выбора
      }

      // УМНОЕ ОБРЕЗАНИЕ ИСНАДА ДЛЯ МЕНЮ
      function getPreviewText(text) {
        // Ищем символ открывающей кавычки « (после иснада)
        const quoteIndex = text.indexOf("«");
        if (quoteIndex !== -1) {
          let res = text
            .substring(quoteIndex + 1)
            .replace("»", "")
            .trim();
          return res.length > 55 ? res.substring(0, 55) + "..." : res;
        }
        // Если кавычек нет, берем начало текста
        return text.substring(0, 55) + "...";
      }

      function renderSidebarList(filterText = "") {
        const container = document.getElementById("hadiths-list-container");
        container.innerHTML = "";

        const filtered = hadiths.filter((h) => {
          const searchStr = filterText.toLowerCase();
          return (
            h.id.toString().includes(searchStr) ||
            h.title.toLowerCase().includes(searchStr) ||
            h.russian.toLowerCase().includes(searchStr)
          );
        });

        if (filtered.length === 0) {
          container.innerHTML = `<div class="p-8 text-center text-sm text-slate-500 font-medium">Ничего не найдено</div>`;
          return;
        }

        filtered.forEach((h) => {
          const originalIndex = hadiths.findIndex((item) => item.id === h.id);
          const isCurrent = originalIndex === currentIndex;
          const previewText = getPreviewText(h.russian);

          const item = document.createElement("div");
          item.className = `p-4 cursor-pointer flex items-center space-x-4 transition border-b border-[#c0a16b]/10 hover:bg-[#fef3c7]/40 ${isCurrent ? "bg-[#fef3c7]/60 border-l-4 border-l-[#c0a16b]" : ""}`;
          item.onclick = () => goToHadith(originalIndex);

          item.innerHTML = `
                    <div class="w-10 h-10 rounded-full gold-gradient flex items-center justify-center text-white font-bold text-sm shadow-md shrink-0">
                        ${h.id}
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <h4 class="font-bold text-[#064e3b] text-[15px] leading-tight mb-0.5">${h.title}</h4>
                        <p class="text-[11px] text-slate-400 truncate">${previewText}</p>
                    </div>
                `;
          container.appendChild(item);
        });
      }

      function filterHadiths(val) {
        renderSidebarList(val);
      }

      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const content = document.getElementById("sidebar-content");
        const searchInput = document.getElementById("search-input");

        if (sidebar.classList.contains("hidden")) {
          sidebar.classList.remove("hidden", "pointer-events-none");
          setTimeout(() => {
            sidebar.classList.remove("opacity-0");
            content.classList.remove("-translate-x-full");
          }, 10);
          renderSidebarList(); // Перерисовать список
          // Сбросить поиск
          searchInput.value = "";
          filterHadiths("");
        } else {
          sidebar.classList.add("opacity-0");
          content.classList.add("-translate-x-full");
          setTimeout(() => {
            sidebar.classList.add("hidden", "pointer-events-none");
          }, 300);
        }
      }

      function copyFullHadith() {
        const h = hadiths[currentIndex];
        const text = `Хадис №${h.id}\n\nАрабский текст:\n${h.arabic}\n\nПеревод:\n${h.russian}${h.explanation ? "\n\nРазъяснение:\n" + h.explanation : ""}`;

        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand("copy");
          showToast("Хадис скопирован полностью");
        } catch (err) {
          showToast("Не удалось скопировать");
        }
        document.body.removeChild(textArea);
      }

      function showToast(msg) {
        const toast = document.getElementById("toast");
        document.getElementById("toast-msg").innerText = msg;
        toast.classList.remove(
          "opacity-0",
          "pointer-events-none",
          "translate-y-4",
        );
        setTimeout(() => {
          toast.classList.add(
            "opacity-0",
            "pointer-events-none",
            "translate-y-4",
          );
        }, 2500);
      }

      // СВАЙПЫ
      let touchstartX = 0;
      let touchendX = 0;
      const mainArea = document.querySelector("main");

      mainArea.addEventListener(
        "touchstart",
        (e) => {
          touchstartX = e.changedTouches[0].screenX;
        },
        { passive: true },
      );

      mainArea.addEventListener(
        "touchend",
        (e) => {
          touchendX = e.changedTouches[0].screenX;
          handleSwipe();
        },
        { passive: true },
      );

      function handleSwipe() {
        const swipeThreshold = 70;
        if (touchendX < touchstartX - swipeThreshold) {
          nextHadith(); // Свайп влево
        }
        if (touchendX > touchstartX + swipeThreshold) {
          prevHadith(); // Свайп вправо
        }
      }

      // Управление с клавиатуры
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") prevHadith();
        if (e.key === "ArrowLeft") nextHadith();
      });

      // Запуск
      updateView();
    </script>
  </body>
</html>
