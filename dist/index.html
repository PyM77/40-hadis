<!doctype html>
<html lang="ru" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>40 Хадисов - аль-Аджурри</title>

    <!-- Настройки для PWA (Apple) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="40 Хадисов" />

    <!-- Иконка из предоставленного образца -->
    <link rel="apple-touch-icon" href="assets/icon.png" />
    <link rel="icon" type="image/png" href="assets/icon.png" />

    <!-- Динамический манифест для Android -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#064e3b">
    <meta name="description" content="40 хадисов имама аль-Аджурри: чтение и самопроверка на арабском с открытием одной или двух строк и русским переводом.">

    <link rel="preload" href="assets/fonts/Amiri-Regular.ttf?v=reference-1" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="assets/fonts/reference-fonts.css?v=reference-2">
    <link rel="stylesheet" href="style.css?v=reference-1">
    <script src="app.js?v=reference-1" defer></script>
  </head>
  <body
    class="text-slate-800 h-screen flex flex-col overflow-hidden selection:bg-[#c0a16b] selection:text-white"
  >


    <!-- Шапка приложения -->
    <header
      class="bg-[#064e3b] text-white shadow-lg z-20 relative border-b-4 border-[#c0a16b]"
    >
      <!-- Декоративный паттерн в шапке -->
      <div
        class="absolute inset-0 opacity-10 pointer-events-none"
        style="
          background-image: url(&quot;data:image/svg+xml,%3Csvg width='20' height='20' viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='2' cy='2' r='2' fill='%23ffffff'/%3E%3C/svg%3E&quot;);
        "
      ></div>

      <div
        class="max-w-md mx-auto px-4 py-3.5 flex justify-between items-center relative z-10"
      >
        <div class="flex items-center space-x-3">
          <button
            id="open-menu" aria-controls="sidebar" aria-expanded="false"
            class="p-2 rounded-xl bg-white/10 hover:bg-white/20 transition active:scale-95"
            aria-label="Меню"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h7"
              ></path>
            </svg>
          </button>
          <div>
            <h1 class="text-lg font-bold tracking-wide font-serif">
              Сорок Хадисов
            </h1>
            <p
              class="text-[11px] text-[#c0a16b] font-medium tracking-wider uppercase"
            >
              Имам аль-Аджурри
            </p>
          </div>
        </div>
        <div class="flex items-center space-x-3">
          <span
            class="text-xs bg-black/30 px-3 py-1.5 rounded-full font-bold shadow-inner"
            id="counter"
            >1 / 40</span
          >
        </div>
      </div>
    </header>

    <!-- Боковое меню -->
    <div
      id="sidebar" role="dialog" aria-modal="true" aria-label="Содержание" aria-hidden="true"
      class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden transition-opacity opacity-0 pointer-events-none"
    >
      <div
        class="absolute left-0 top-0 bottom-0 w-[85%] max-w-sm bg-[#fdfbf7] shadow-2xl flex flex-col transform -translate-x-full transition-transform duration-300"
        id="sidebar-content"
      >
        <div
          class="p-5 bg-[#064e3b] text-white flex justify-between items-center border-b-4 border-[#c0a16b]"
        >
          <h2 class="font-bold text-lg font-serif">Содержание</h2>
          <button
            id="close-menu" aria-label="Закрыть меню"
            class="p-1.5 rounded-xl bg-white/10 hover:bg-white/20 transition"
          >
            <svg
              class="w-6 h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>
        </div>

        <div class="p-4 bg-white shadow-sm z-10 relative">
          <div class="relative">
            <svg
              class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
            <input
              type="text"
              id="search-input"
              aria-label="Найти хадис по номеру или смыслу"
              placeholder="Поиск по смыслу..."
              class="w-full pl-10 pr-4 py-3 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#c0a16b] focus:bg-white transition"
            />
          </div>
        </div>

        <div class="flex-1 overflow-y-auto" id="hadiths-list-container">
          <!-- Динамический список -->
        </div>
      </div>
    </div>

    <!-- Основной контент -->
    <main class="flex-1 overflow-y-auto relative w-full">
      <div
        class="max-w-md mx-auto p-4 min-h-full flex flex-col"
        id="card-container" aria-busy="true"
      >
        <div
          class="bg-white rounded-[24px] shadow-[0_8px_30px_rgb(0,0,0,0.08)] p-6 flex-1 flex flex-col relative overflow-hidden gold-border"
        >
          <!-- Орнамент в углу -->
          <svg
            class="absolute top-0 right-0 w-32 h-32 text-[#c0a16b] opacity-10 pointer-events-none transform translate-x-8 -translate-y-8"
            viewBox="0 0 100 100"
            fill="currentColor"
          >
            <path d="M50 0L60 40L100 50L60 60L50 100L40 60L0 50L40 40Z" />
          </svg>

          <div class="relative z-10 flex-1 space-y-6">
            <!-- Номер хадиса -->
            <div class="flex items-center justify-between">
              <div
                class="gold-gradient text-white px-5 py-2 rounded-full font-bold text-sm shadow-md flex items-center space-x-2"
              >
                <span>Хадис №</span>
                <span id="hadith-num" class="text-lg">1</span>
              </div>
              <button
                id="copy-hadith" aria-label="Скопировать хадис"
                class="p-2 text-slate-400 hover:text-[#c0a16b] bg-slate-50 rounded-full transition"
                title="Скопировать всё"
              >
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"
                  ></path>
                </svg>
              </button>
            </div>

            <div class="mode-tabs" role="tablist" aria-label="Режим просмотра">
              <button type="button" id="practice-tab" role="tab" aria-selected="true" aria-controls="arabic-area">Самопроверка</button>
              <button type="button" id="reading-tab" role="tab" aria-selected="false" aria-controls="arabic-area" tabindex="-1">Чтение</button>
            </div>
            <!-- Арабский текст -->
            <div class="pt-2" id="arabic-area" role="tabpanel" aria-labelledby="practice-tab">
              <div
                class="arabic-text text-[26px] sm:text-[30px] text-[#064e3b] text-center"
                id="arabic-text" lang="ar"
                dir="rtl"
              ><p class="loading-text" lang="ru" dir="ltr">Загружаем хадисы…</p></div>
            </div>

            <section class="practice-tools" id="practice-tools" aria-label="Проверка заучивания">
              <div class="practice-meta"><span id="reveal-status" role="status" aria-live="polite">Текст скрыт</span><div class="size-buttons" aria-label="Размер арабского текста"><button id="smaller" aria-label="Уменьшить арабский текст">A−</button><button id="larger" aria-label="Увеличить арабский текст">A+</button></div></div>
              <div class="practice-progress" aria-hidden="true"><div id="reading-bar"></div></div>
              <p class="practice-hint" id="memory-hint">Сначала прочитайте по памяти,<br>затем откройте следующую строку.</p>
              <div class="step-control" role="group" aria-label="Сколько строк открывать"><button id="step-one" aria-pressed="true">1 строка</button><button id="step-two" aria-pressed="false">2 строки</button></div>
              <button id="reveal" class="reveal-button gold-gradient" disabled>Открыть строку <span aria-hidden="true">←</span></button>
              <div class="secondary-actions"><button id="restart" disabled>Начать заново</button><button id="show-all" disabled>Открыть всё</button></div>
              <button id="mark-done" class="mark-done" aria-pressed="false" disabled><span aria-hidden="true">✓</span> <span id="done-label">Отметить повторённым</span></button>
            </section>
            <!-- Разделитель -->
            <div class="flex justify-center items-center py-2 opacity-30">
              <div class="h-px bg-[#c0a16b] flex-1"></div>
              <svg
                class="w-6 h-6 text-[#c0a16b] mx-4"
                fill="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  d="M12 2L15 10H23L16 15L19 23L12 18L5 23L8 15L1 10H9L12 2Z"
                />
              </svg>
              <div class="h-px bg-[#c0a16b] flex-1"></div>
            </div>

            <!-- Перевод -->
            <div>
              <button id="toggle-translation" class="translation-toggle" aria-expanded="false" aria-controls="translation-panel">
              <h3
                class="text-[10px] font-bold uppercase tracking-widest text-[#c0a16b] mb-3"
              >
                Русский перевод
              </h3><span id="translation-action">Показать <span aria-hidden="true">⌄</span></span>
              </button>
              <div id="translation-panel" hidden>
              <p
                class="text-slate-700 text-[15px] sm:text-[16px] leading-relaxed font-medium"
                id="russian-text"
              ></p>
              </div>
            </div>

            <div class="source-links"><a id="arabic-source" href="assets/arabic-original.pdf" target="_blank" rel="noopener">Арабский оригинал ↗</a><a id="translation-source" href="assets/russian-translation.pdf" target="_blank" rel="noopener">Русская книга ↗</a></div>
          </div>
        </div>
      </div>
    </main>

    <!-- Нижняя навигация -->
    <div
      class="bg-white border-t border-slate-200 px-4 py-3 z-20 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]"
    >
      <div class="max-w-md mx-auto flex gap-3">
        <button
          aria-label="Предыдущий хадис"
          id="prev-btn"
          class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3.5 px-4 rounded-xl transition text-sm disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center space-x-2"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
          <span>Назад</span>
        </button>
        <button
          aria-label="Следующий хадис"
          id="next-btn"
          class="flex-1 gold-gradient text-white font-semibold py-3.5 px-4 rounded-xl transition shadow-lg shadow-[#c0a16b]/30 text-sm flex items-center justify-center space-x-2"
        >
          <span>Вперед</span>
          <svg
            class="w-5 h-5"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            ></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Уведомления (Toast) -->
    <div
      id="toast" role="status" aria-live="polite"
      class="fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full text-sm font-medium shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center space-x-2"
    >
      <svg
        class="w-5 h-5 text-green-400"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M5 13l4 4L19 7"
        ></path>
      </svg>
      <span id="toast-msg">Скопировано</span>
    </div>


  </body>
</html>
